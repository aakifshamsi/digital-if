name: dBeaver Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - dry-run
          - github-pages
          - cpanel-sftp
          - cloudflare-pages
      ref:
        description: "Git ref to deploy (branch/tag/SHA)"
        required: false
        default: ""

concurrency:
  group: dbeaver-deploy-${{ github.event.inputs.target || 'dry-run' }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.capture.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Capture target
        id: capture
        run: echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"

      - name: Run preflight checks
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_REMOTE_DIR: ${{ secrets.CPANEL_REMOTE_DIR }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: bash projects/dbeaver/scripts/preflight.sh "${{ github.event.inputs.target }}"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbeaver-site
          path: projects/dbeaver/
          if-no-files-found: error

  deploy-github-pages:
    if: needs.preflight.outputs.target == 'github-pages'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dbeaver-site
          path: ./site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cpanel:
    if: needs.preflight.outputs.target == 'cpanel-sftp'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dbeaver-site
          path: projects/dbeaver/

      - name: Install rsync client
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Deploy to cPanel over SSH/SFTP
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_REMOTE_DIR: ${{ secrets.CPANEL_REMOTE_DIR }}
        run: bash projects/dbeaver/scripts/deploy-cpanel.sh

  deploy-cloudflare-pages:
    if: needs.preflight.outputs.target == 'cloudflare-pages'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout the source directly — cf-deploy.sh deploys from
      # projects/dbeaver/ (it cd's there before invoking wrangler so the
      # functions/ directory is correctly bundled). The artifact route
      # used previously caused wrangler to scan the wrong CWD and ship
      # a static-only build with no /api/* routes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Cloudflare Pages payload
        run: |
          set -euo pipefail
          echo "Checked out ref: $(git rev-parse --short HEAD)"
          test -f projects/dbeaver/index.html
          test -f projects/dbeaver/wrangler.toml
          test -f projects/dbeaver/functions/api/health.js
          test -d projects/dbeaver/functions/_shared
          echo "Functions that will be deployed:"
          (cd projects/dbeaver && find functions -maxdepth 4 -type f | sort)
          echo "wrangler.toml:"
          sed -n '1,80p' projects/dbeaver/wrangler.toml

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          CF_BRANCH: main
        run: |
          set -o pipefail
          bash projects/dbeaver/scripts/cf-deploy.sh 2>&1 | tee deploy.log
          DEPLOY_URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Verify /api/health
        id: health
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          echo "Probing $DEPLOY_URL/api/health ..."
          # Retry a few times — Functions can take ~20s to propagate.
          for i in 1 2 3 4 5; do
            BODY=$(curl -s --max-time 10 "$DEPLOY_URL/api/health" || true)
            echo "  attempt $i: $BODY"
            if echo "$BODY" | grep -q '"runtime":"cloudflare-pages-functions"'; then
              echo "health_body=$BODY" >> "$GITHUB_OUTPUT"
              if echo "$BODY" | grep -q '"kv":"ok"'; then
                echo "status=green" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "status=functions-ok-kv-missing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "status=no-functions" >> "$GITHUB_OUTPUT"
          echo "health_body=$BODY" >> "$GITHUB_OUTPUT"
          echo "::warning::/api/health did not return Functions runtime — check Cloudflare dashboard."

      - name: Publish deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_BODY: ${{ steps.health.outputs.health_body }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          STABLE="https://${PROJECT}.pages.dev"
          case "$HEALTH_STATUS" in
            green)                    EMOJI="✅"; NOTE="Functions routing + KV binding healthy." ;;
            functions-ok-kv-missing)  EMOJI="⚠️"; NOTE="Functions live but KV unbound — run scripts/kv-bootstrap.sh." ;;
            no-functions)             EMOJI="❌"; NOTE="Functions did NOT register — /api/health returned no JSON runtime." ;;
            *)                        EMOJI="❓"; NOTE="Unknown health state." ;;
          esac
          {
            echo "## $EMOJI dBeaver deployed"
            echo ""
            echo "**Preview URL (this build):** $DEPLOY_URL"
            echo ""
            echo "**Stable alias (production):** $STABLE"
            echo ""
            echo "**Health:** \`$HEALTH_STATUS\` — $NOTE"
            echo ""
            if [ -n "$HEALTH_BODY" ]; then
              echo '```json'
              echo "$HEALTH_BODY"
              echo '```'
            fi
            echo ""
            echo "### Magic-link flow"
            echo "1. Open \`$STABLE/admin/login.html\` and sign in as admin."
            echo "2. On a client card, click **🔗 Magic link** — URL is copied to clipboard."
            echo "3. Shorten with is.gd and send via WhatsApp."
          } >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "============================================================"
          echo "  Preview URL : $DEPLOY_URL"
          echo "  Stable URL  : $STABLE"
          echo "  Health      : $HEALTH_STATUS"
          echo "============================================================"
          if [ "$HEALTH_STATUS" = "no-functions" ]; then
            exit 1
          fi

  dry-run:
    if: needs.preflight.outputs.target == 'dry-run'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dry-run successful. Preflight and packaging completed."
