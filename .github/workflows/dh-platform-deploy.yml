name: Deploy dh-platform

on:
  push:
    branches: [main]
    paths:
      - 'projects/dh-platform/**'
      - '.github/workflows/dh-platform-deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-dh-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b
        with:
          persist-credentials: false
      - uses: actions/setup-node@1f8c5b7404f3b80e3399dc44f27998c99a90e23e
        with:
          node-version: '18'
      - run: npm install -g wrangler
      - name: Deploy to Cloudflare Pages
        working-directory: projects/dh-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy . --project-name dh-platform