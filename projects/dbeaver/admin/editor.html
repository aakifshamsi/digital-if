<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Editor — DigitalHands Admin</title>
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%234a6cf7' rx='6'/><text y='22' x='8' font-size='16' font-weight='700' fill='%23fff' font-family='system-ui'>dH</text></svg>">
  <style>
    body { overflow: hidden; }
    .editor-wrap { display: flex; height: calc(100vh - 64px); }
    .editor-sidebar { width: 340px; flex-shrink:0; background:var(--navy-mid); border-right:1px solid var(--border); overflow-y:auto; }
    .editor-main { flex:1; display:flex; flex-direction:column; background:#0a0f1e; overflow:hidden; }
    .editor-toolbar { display:flex; align-items:center; gap:8px; padding:8px 16px; background:var(--navy-mid); border-bottom:1px solid var(--border); flex-shrink:0; }
    .editor-frame { flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:20px; }
    .editor-frame iframe { border:none; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.5); transition:width .3s; }
    .device-btn { background:var(--card-bg); border:1px solid var(--border); color:var(--text-mid); padding:5px 10px; border-radius:5px; cursor:pointer; font-size:.82rem; transition:all .2s; }
    .device-btn.active { border-color:var(--blue); color:var(--blue-light); background:rgba(74,108,247,.1); }

    .panel-tab { display:flex; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--navy-mid); z-index:5; }
    .panel-tab-btn { flex:1; padding:11px 0; font-size:.74rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; background:none; border:none; color:var(--text-dim); cursor:pointer; transition:color .2s; border-bottom:2px solid transparent; }
    .panel-tab-btn.active { color:var(--blue-light); border-bottom-color:var(--blue); }
    .panel-content { padding:16px; display:none; }
    .panel-content.active { display:block; }

    /* Form fields */
    .field-row { margin-bottom:12px; }
    .field-label { font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin-bottom:5px; display:block; }
    .field-input, .field-textarea, .field-select {
      background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:5px;
      padding:8px 10px; color:var(--text); font-size:.85rem; width:100%; outline:none;
      font-family:inherit;
    }
    .field-input:focus, .field-textarea:focus, .field-select:focus { border-color:var(--blue); }
    .field-textarea { resize:vertical; min-height:60px; }
    .field-color { display:flex; align-items:center; gap:8px; }
    .field-color input[type=color] { width:38px; height:30px; padding:2px; border:1px solid var(--border); border-radius:4px; background:none; cursor:pointer; }

    /* Collapsible sections */
    details.cms-section { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:8px; margin-bottom:12px; }
    details.cms-section[open] { background:rgba(255,255,255,.03); }
    details.cms-section > summary {
      cursor:pointer; padding:11px 14px; font-size:.78rem; font-weight:600;
      letter-spacing:.1em; text-transform:uppercase; color:var(--text);
      display:flex; justify-content:space-between; align-items:center;
      list-style:none;
    }
    details.cms-section > summary::-webkit-details-marker { display:none; }
    details.cms-section > summary::after { content:'+'; color:var(--text-dim); font-size:1.1rem; transition:transform .2s; }
    details.cms-section[open] > summary::after { content:'−'; }
    details.cms-section > .cms-body { padding:0 14px 14px; }

    /* Repeater */
    .repeater-item {
      background:rgba(0,0,0,.2); border:1px solid var(--border);
      border-radius:6px; padding:12px; margin-bottom:10px; position:relative;
    }
    .repeater-item-head {
      display:flex; align-items:center; gap:8px; margin-bottom:8px;
      font-size:.74rem; font-weight:600; color:var(--text-mid);
      letter-spacing:.08em; text-transform:uppercase;
    }
    .repeater-item-head .idx {
      background:var(--blue); color:#fff; width:22px; height:22px; border-radius:50%;
      display:inline-flex; align-items:center; justify-content:center; font-size:.7rem;
    }
    .repeater-item-head .remove-btn {
      margin-left:auto; background:transparent; border:none; color:var(--red);
      cursor:pointer; font-size:.85rem; padding:2px 6px;
    }
    .add-item-btn {
      width:100%; background:rgba(74,108,247,.08); border:1px dashed rgba(74,108,247,.3);
      color:var(--blue-light); padding:9px; border-radius:6px; cursor:pointer;
      font-size:.78rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
      transition:all .2s;
    }
    .add-item-btn:hover { background:rgba(74,108,247,.15); }

    /* Style presets */
    .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
    .preset-btn {
      background:var(--card-bg); border:1px solid var(--border);
      color:var(--text-mid); padding:9px 8px; border-radius:6px;
      cursor:pointer; font-size:.75rem; text-align:center; transition:all .2s;
    }
    .preset-btn:hover { background:var(--card-hover); }
    .preset-btn.active { border-color:var(--blue); color:var(--blue-light); background:rgba(74,108,247,.1); }

    /* Page nav */
    .page-nav { display:flex; flex-direction:column; gap:4px; padding:12px; }
    .page-nav-btn {
      display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:6px;
      background:none; border:none; color:var(--text-mid); font-size:.84rem;
      cursor:pointer; width:100%; text-align:left; transition:all .2s;
    }
    .page-nav-btn:hover { background:var(--card-hover); color:var(--text); }
    .page-nav-btn.active { background:rgba(74,108,247,.12); color:var(--blue-light); }

    .ai-btn { background:linear-gradient(135deg,#7c3aed,#4a6cf7); border:none; color:#fff; padding:9px 14px; border-radius:6px; font-size:.8rem; cursor:pointer; width:100%; margin-bottom:8px; transition:all .2s; }
    .ai-btn:hover { opacity:.88; transform:translateY(-1px); }
  </style>
</head>
<body>
<div class="admin-layout" style="display:flex; flex-direction:column;">

  <!-- Topbar -->
  <div class="topbar">
    <a href="dashboard.html" style="color:var(--text-dim); font-size:.85rem; margin-right:12px;">← Dashboard</a>
    <div class="topbar-title" id="editor-title">Site Editor</div>
    <div class="topbar-actions">
      <select id="client-select" class="topbar-btn" style="cursor:pointer; max-width:200px;"></select>
      <button class="topbar-btn" id="save-btn">💾 Save</button>
      <button class="topbar-btn topbar-btn-primary" id="preview-btn">🌐 Preview Live</button>

  </div>

  <div class="editor-wrap">

    <!-- Left panel -->
    <div class="editor-sidebar">
      <div class="panel-tab">
        <button class="panel-tab-btn active" data-tab="pages">Pages</button>
        <button class="panel-tab-btn" data-tab="style">Style</button>
        <button class="panel-tab-btn" data-tab="content">Content</button>
        <button class="panel-tab-btn" data-tab="ai">AI ✨</button>
      </div>

      <!-- Pages Tab -->
      <div class="panel-content active" id="tab-pages">
        <div class="page-nav">
          <button class="page-nav-btn active" data-page="index.html">🏠 Home</button>
          <button class="page-nav-btn" data-page="services.html">💆 Services</button>
          <button class="page-nav-btn" data-page="about.html">ℹ️ About</button>
          <button class="page-nav-btn" data-page="booking.html">📅 Booking</button>

      <!-- Style Tab -->

          <button class="preset-btn" data-preset="classic">🌿 Classic Green</button>

          <button class="preset-btn" data-preset="rose">🌸 Rose &amp; Blush</button>

        <div class="field-row">

        <div class="field-row">

        <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">

              <input type="text" class="field-input" data-content="settings.brandName">

<script src="assets/js/admin.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════════ */
let currentClientId = 'cli_001';
let currentPage = 'index.html';
let workingContent = null; // populated on client switch
let workingTheme   = null;
const iframe = document.getElementById('preview-frame');

const PRESETS = {
  jetblack: {
    colors: { 'black':'#000000', 'black-soft':'#111111', 'black-card':'#1a1a1a', 'gold':'#c5a47e', 'white':'#ffffff', 'gray':'#aaaaaa' },
    fonts:  { display:"'Playfair Display', Georgia, serif", body:"'Montserrat', 'Helvetica Neue', Arial, sans-serif" }
  },
  classic: {
    colors: { 'black':'#1a3a2a', 'black-soft':'#2d5a3d', 'black-card':'#faf7f2', 'gold':'#c9a96e', 'white':'#2c2c2c', 'gray':'#555' },
    fonts:  { display:"Georgia, serif", body:"'Helvetica Neue', Arial, sans-serif" }
  },
  ocean: {
    colors: { 'black':'#0d3b5e', 'black-soft':'#11507d', 'black-card':'#f5f8fa', 'gold':'#e8c96d', 'white':'#1a1a1a', 'gray':'#5a6b7a' },
    fonts:  { display:"'Lora', serif", body:"'Inter', sans-serif" }
  },
  rose: {
    colors: { 'black':'#4a1942', 'black-soft':'#6b2861', 'black-card':'#fdf5f6', 'gold':'#e8899a', 'white':'#2c2c2c', 'gray':'#777' },
    fonts:  { display:"'Cormorant Garamond', serif", body:"'Lato', sans-serif" }
  }
};

/* ════════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════════ */
function postToFrame(message) {
  if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(message, '*');
}
function debounce(fn, wait) {
  let t; return function() { clearTimeout(t); t = setTimeout(() => fn.apply(this, arguments), wait); };
}
function setPath(obj, path, value) {
  const keys = path.split('.');
  let cur = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (cur[keys[i]] == null || typeof cur[keys[i]] !== 'object') cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length - 1]] = value;
}
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}

/* ════════════════════════════════════════════════════════════
   CLIENT SELECTOR
════════════════════════════════════════════════════════════ */
function populateClientSelector() {
  const sel = document.getElementById('client-select');
  sel.innerHTML = '';
  window.getClients().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    sel.appendChild(opt);
  });
  sel.value = currentClientId;
  sel.addEventListener('change', function() {
    currentClientId = this.value;
    const c = window.getClients().find(x => x.id === currentClientId);
    document.getElementById('editor-title').textContent = 'Site Editor — ' + (c ? c.name : '');
    loadClientData();
    iframe.src = '../demo/' + currentPage + '?client=' + currentClientId;
  });
}

/* ════════════════════════════════════════════════════════════
   LOAD CLIENT CONTENT + THEME
════════════════════════════════════════════════════════════ */
function loadClientData() {
  workingContent = window.getContent(currentClientId);
  workingTheme   = window.getTheme(currentClientId);
  syncContentForm();
  syncThemeForm();
  renderRepeaters();
  const c = window.getClients().find(x => x.id === currentClientId);
  if (c) document.getElementById('editor-title').textContent = 'Site Editor — ' + c.name;
}

function syncContentForm() {
  document.querySelectorAll('[data-content]').forEach(el => {
    const val = getPath(workingContent, el.dataset.content);
    el.value = val == null ? '' : val;
  });
}

function syncThemeForm() {
  Object.entries(workingTheme.colors || {}).forEach(([token, val]) => {
    document.querySelectorAll('[data-token="' + token + '"]').forEach(el => {
      el.value = val;
    });
  });
  if (workingTheme.fonts) {
    document.getElementById('font-display').value = workingTheme.fonts.display || '';
    document.getElementById('font-body').value    = workingTheme.fonts.body    || '';
  }
}

/* ════════════════════════════════════════════════════════════
   CONTENT FIELD BINDINGS (settings + simple paths)
════════════════════════════════════════════════════════════ */
const liveContentUpdate = debounce(() => {
  postToFrame({ type: 'content-update', content: workingContent });
}, 180);

document.addEventListener('input', (e) => {
  // settings.* and other dot-path content fields
  if (e.target.matches('[data-content]')) {
    setPath(workingContent, e.target.dataset.content, e.target.value);
    liveContentUpdate();
  }
  // Theme color inputs
  if (e.target.matches('[data-token]')) {
    const token = e.target.dataset.token;
    const val = e.target.value;
    workingTheme.colors = workingTheme.colors || {};
    workingTheme.colors[token] = val;
    // Sync sibling input (hex ↔ color picker)
    document.querySelectorAll('[data-token="' + token + '"]').forEach(el => { if (el !== e.target) el.value = val; });
    postToFrame({ type: 'theme-update', theme: workingTheme });
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'font-display') {
    workingTheme.fonts = workingTheme.fonts || {};
    workingTheme.fonts.display = e.target.value;
    postToFrame({ type: 'theme-update', theme: workingTheme });
  }
  if (e.target.id === 'font-body') {
    workingTheme.fonts = workingTheme.fonts || {};
    workingTheme.fonts.body = e.target.value;
    postToFrame({ type: 'theme-update', theme: workingTheme });
  }
});

/* ════════════════════════════════════════════════════════════
   REPEATERS — Hero, Services, Pricing, Team
════════════════════════════════════════════════════════════ */
const REPEATER_DEFS = {
  heroSlides: {
    containerId: 'hero-repeater',
    label: 'Slide',
    fields: [
      { key: 'title',       label: 'Title' },
      { key: 'titleAccent', label: 'Accent / Italic part' },
      { key: 'subtitle',    label: 'Eyebrow / Subtitle' },

function renderRepeaters() {
  for (const key in REPEATER_DEFS) renderRepeater(key);
}

function renderRepeater(key) {
  const def = REPEATER_DEFS[key];
  const container = document.getElementById(def.containerId);
  if (!container) return;
  container.innerHTML = '';
  const items = workingContent[key] || [];
  items.forEach((item, idx) => container.appendChild(buildRepeaterItem(key, item, idx)));
}

function buildRepeaterItem(key, item, idx) {
  const def = REPEATER_DEFS[key];
  const wrap = document.createElement('div');
  wrap.className = 'repeater-item';
  wrap.dataset.repeaterKey = key;
  wrap.dataset.repeaterIdx = String(idx);

  const head = document.createElement('div');
  head.className = 'repeater-item-head';
  head.innerHTML = `<span class="idx">${idx + 1}</span><span>${def.label} ${idx + 1}</span>`;
  const rmBtn = document.createElement('button');
  rmBtn.type = 'button'; rmBtn.className = 'remove-btn'; rmBtn.textContent = '✕ Remove';
  rmBtn.addEventListener('click', () => {
    workingContent[key].splice(idx, 1);
    renderRepeater(key);
    liveContentUpdate();
  });
  head.appendChild(rmBtn);
  wrap.appendChild(head);

  def.fields.forEach(f => {
    const row = document.createElement('div');
    row.className = 'field-row';
    const lbl = document.createElement('label');
    lbl.className = 'field-label';
    lbl.textContent = f.label;
    row.appendChild(lbl);

    let inp;
    if (f.type === 'textarea' || f.type === 'features') {
      inp = document.createElement('textarea');
      inp.className = 'field-textarea';
      inp.rows = f.type === 'features' ? 4 : 2;
      if (f.type === 'features') {
        const v = getPath(item, f.key);
        inp.value = Array.isArray(v) ? v.join('\n') : (v || '');
      } else {
        inp.value = getPath(item, f.key) || '';
      }
    } else if (f.type === 'checkbox') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!getPath(item, f.key);
    } else {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'field-input';
      inp.value = getPath(item, f.key) || '';
    }
    inp.dataset.fieldKey = f.key;
    inp.dataset.fieldType = f.type || 'text';
    inp.addEventListener('input', () => {
      let val;
      if (f.type === 'checkbox') val = inp.checked;
      else if (f.type === 'features') val = inp.value.split('\n').map(s => s.trim()).filter(Boolean);
      else val = inp.value;
      setPath(workingContent[key][idx], f.key, val);
      liveContentUpdate();
    });
    row.appendChild(inp);
    wrap.appendChild(row);
  });
  return wrap;
}

/* Add new item to repeater */
document.addEventListener('click', (e) => {
  if (!e.target.matches('[data-add]')) return;
  const key = e.target.dataset.add;
  if (!workingContent[key]) workingContent[key] = [];
  const templates = {
    heroSlides:   { title: 'New Slide', titleAccent: '', subtitle: '', description: '', image: '', ctaText: '', ctaLink: '#' },
    services:     { number: String(workingContent.services.length + 1).padStart(2, '0'), title: 'New Service', price: '$0', image: '', description: '' },
    pricingPlans: { name: 'New Plan', subtitle: '', price: 0, period: '/Mo', features: [], ctaText: 'Get Now', ctaLink: '#', isActive: false },
    team:         { name: 'New Member', role: '', image: '', social: { facebook: '', twitter: '', instagram: '' } }
  };
  workingContent[key].push(JSON.parse(JSON.stringify(templates[key])));
  renderRepeater(key);
  liveContentUpdate();
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const preset = PRESETS[btn.dataset.preset];
    if (!preset) return;
    workingTheme = JSON.parse(JSON.stringify(preset));

    postToFrame({ type: 'theme-update', theme: workingTheme });
    window.showToast('Preset applied. Save to persist.', 'info');
  });
});

document.getElementById('save-btn').addEventListener('click', () => {
  window.saveContent(currentClientId, workingContent);
  window.saveTheme(currentClientId, workingTheme);
  window.showToast('Saved successfully', 'success');
  // Re-post in case any non-form changes weren't yet broadcast
  postToFrame({ type: 'content-update', content: workingContent });
  postToFrame({ type: 'theme-update',   theme:   workingTheme   });
});

/* Re-apply theme + content after iframe reload */
iframe.addEventListener('load', () => {
  if (workingContent) postToFrame({ type: 'content-update', content: workingContent });
  if (workingTheme)   postToFrame({ type: 'theme-update',   theme:   workingTheme   });
});
